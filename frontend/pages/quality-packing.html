<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality & Packing | Mini ERP</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🏭</div>
                <span class="brand-text">Mini ERP</span>
            </div>
            <nav>
                <a class="nav-link" href="/pages/dashboard.html">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    <span class="nav-text">Dashboard</span>
                </a>
                
                <div class="nav-group">
                    <div class="nav-title">Orders & Production</div>
                    <a class="nav-link" href="/pages/orders.html">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
                        <span class="nav-text">Customer Orders</span>
                    </a>
                    <a class="nav-link" href="/pages/production.html">
                        <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        <span class="nav-text">Production Board</span>
                    </a>
                    <a class="nav-link active" href="/pages/quality-packing.html">
                        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        <span class="nav-text">Quality & Packing</span>
                    </a>
                    <a class="nav-link" href="/pages/dispatch.html">
                        <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                        <span class="nav-text">Dispatch</span>
                    </a>
                </div>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <strong style="font-size: 16px; font-weight: 700;">Quality Control & Garment Packing</strong>
                </div>
                <div class="topbar-right">
                    <button class="btn secondary btn-sm" data-logout>Logout</button>
                </div>
            </header>

            <section class="content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Quality Control & Packing</h1>
                        <p class="muted">Inspect stitched garments, log pass/fail numbers, and prepare packed orders for dispatch.</p>
                    </div>
                </div>

                <div data-status class="status"></div>

                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
                    <!-- Quality Control Audit Card -->
                    <div class="card">
                        <h3 style="margin-top:0; font-size:16px;">1. Perform Quality Check</h3>
                        <form id="qcForm" onsubmit="submitQC(event)">
                            <div class="form-grid">
                                <div class="full">
                                    <label>Select Production Order <span class="required-asterisk">*</span></label>
                                    <select name="order_id" id="qcOrderSelect" required onchange="fillQCOrderDetails()"></select>
                                </div>
                                <div>
                                    <label>Checked Quantity</label>
                                    <input type="number" name="checked_quantity" id="qcCheckedQty" value="500" required>
                                </div>
                                <div>
                                    <label>Passed Quantity <span class="required-asterisk">*</span></label>
                                    <input type="number" name="passed_quantity" id="qcPassedQty" value="480" required>
                                </div>
                                <div>
                                    <label>Failed / Rejected Quantity</label>
                                    <input type="number" name="failed_quantity" id="qcFailedQty" value="20">
                                </div>
                                <div>
                                    <label>Defective Quantity</label>
                                    <input type="number" name="defective_quantity" id="qcDefectiveQty" value="0">
                                </div>
                                <div class="full">
                                    <label>Inspector Remarks / Defect Description</label>
                                    <textarea name="remarks" rows="2" placeholder="e.g. 20 pcs had loose stitching on cuff"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn" style="margin-top:16px;">Submit Quality Audit</button>
                        </form>
                    </div>

                    <!-- Packing Completion Card -->
                    <div class="card">
                        <h3 style="margin-top:0; font-size:16px;">2. Record Packing</h3>
                        <form id="packForm" onsubmit="submitPacking(event)">
                            <div class="form-grid">
                                <div class="full">
                                    <label>Select Production Order <span class="required-asterisk">*</span></label>
                                    <select name="order_id" id="packOrderSelect" required onchange="fillPackOrderDetails()"></select>
                                </div>
                                <div>
                                    <label>Packed Quantity <span class="required-asterisk">*</span></label>
                                    <input type="number" name="packed_quantity" id="packQty" value="480" required>
                                </div>
                                <div>
                                    <label>Packaging Material Used</label>
                                    <input type="text" name="packaging_material_used" placeholder="e.g. Polybag + Corrugated Master Box">
                                </div>
                            </div>
                            <button type="submit" class="btn success" style="margin-top:16px;">Mark Order as Packed & Ready for Dispatch</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let ordersList = [];

        async function initQCPage() {
            await requireLogin();
            loadOrders();
        }

        async function loadOrders() {
            try {
                ordersList = await api.request("/api/orders");
                
                const qcSel = document.getElementById("qcOrderSelect");
                const packSel = document.getElementById("packOrderSelect");

                const qcOrders = ordersList.filter(o => ["Stitching", "Finishing", "Quality Check"].includes(o.current_stage));
                const packOrders = ordersList.filter(o => ["Quality Check", "Packing"].includes(o.current_stage));

                qcSel.innerHTML = qcOrders.map(o => `<option value="${o.id}">${o.order_number} — ${o.garment_name} (Qty: ${o.quantity})</option>`).join("");
                packSel.innerHTML = packOrders.map(o => `<option value="${o.id}">${o.order_number} — ${o.garment_name} (Qty: ${o.quantity})</option>`).join("");

                if (!qcOrders.length) qcSel.innerHTML = '<option value="">No orders pending Quality Check</option>';
                if (!packOrders.length) packSel.innerHTML = '<option value="">No orders ready for Packing</option>';

                fillQCOrderDetails();
                fillPackOrderDetails();
            } catch (e) {
                console.error(e);
            }
        }

        function fillQCOrderDetails() {
            const id = document.getElementById("qcOrderSelect").value;
            const ord = ordersList.find(o => o.id == id);
            if (ord) {
                document.getElementById("qcCheckedQty").value = ord.quantity;
                document.getElementById("qcPassedQty").value = ord.quantity;
                document.getElementById("qcFailedQty").value = 0;
            }
        }

        function fillPackOrderDetails() {
            const id = document.getElementById("packOrderSelect").value;
            const ord = ordersList.find(o => o.id == id);
            if (ord) {
                document.getElementById("packQty").value = ord.quantity;
            }
        }

        async function submitQC(e) {
            e.preventDefault();
            const orderId = document.getElementById("qcOrderSelect").value;
            if (!orderId) return;

            const data = collectForm(document.getElementById("qcForm"));
            try {
                const res = await api.request(`/api/orders/${orderId}/quality-check`, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                showToast(res.message, "success", "Quality Audit Logged");
                loadOrders();
            } catch (err) {
                setStatus(err.message, "error");
            }
        }

        async function submitPacking(e) {
            e.preventDefault();
            const orderId = document.getElementById("packOrderSelect").value;
            if (!orderId) return;

            const data = collectForm(document.getElementById("packForm"));
            try {
                const res = await api.request(`/api/orders/${orderId}/packing`, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                showToast(res.message, "success", "Order Packed");
                loadOrders();
            } catch (err) {
                setStatus(err.message, "error");
            }
        }

        document.addEventListener("DOMContentLoaded", initQCPage);
    </script>
</body>
</html>
