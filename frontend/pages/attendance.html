<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Attendance | Mini ERP</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🏭</div>
                <span class="brand-text">Mini ERP</span>
            </div>
            <nav>
                <a class="nav-link" href="/pages/dashboard.html">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    <span class="nav-text">Dashboard</span>
                </a>
                
                <div class="nav-group">
                    <div class="nav-title">Staff & Operations</div>
                    <a class="nav-link" href="/pages/employees.html">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span class="nav-text">Workers</span>
                    </a>
                    <a class="nav-link active" href="/pages/attendance.html">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span class="nav-text">Attendance</span>
                    </a>
                </div>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <strong style="font-size: 16px; font-weight: 700;">Simple Worker Attendance Register</strong>
                </div>
                <div class="topbar-right">
                    <button class="btn secondary btn-sm" data-logout>Logout</button>
                </div>
            </header>

            <section class="content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Worker Attendance</h1>
                        <p class="muted">Record daily presence, absences, and leaves across production departments.</p>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="date" id="attDateSelect" onchange="loadAttendance()" style="max-width:180px;">
                        <button class="btn" onclick="saveAllAttendance()">Save Attendance</button>
                    </div>
                </div>

                <div data-status class="status"></div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Worker Name</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>Status</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <!-- Loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
        async function initAttendancePage() {
            await requireLogin();
            document.getElementById("attDateSelect").value = new Date().toISOString().split("T")[0];
            loadAttendance();
        }

        async function loadAttendance() {
            const dateVal = document.getElementById("attDateSelect").value;
            try {
                const res = await api.request(`/api/attendance?date=${dateVal}`);
                renderAttendanceTable(res.records || []);
            } catch (e) {
                setStatus(e.message, "error");
            }
        }

        function renderAttendanceTable(records) {
            const tbody = document.getElementById("attendanceTableBody");
            if (!records.length) {
                tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><span class="empty-icon">👥</span><span>No active workers registered. Add workers in Employees module.</span></div></td></tr>';
                return;
            }

            tbody.innerHTML = records.map(r => `
                <tr data-emp-id="${r.employee_id}">
                    <td><strong>${r.employee_name}</strong></td>
                    <td><span class="badge info">${r.department_name || 'Production'}</span></td>
                    <td>${r.designation || 'Worker'}</td>
                    <td>
                        <select class="att-status-select" style="max-width:140px;">
                            <option value="Present" ${r.status === 'Present' ? 'selected' : ''}>✅ Present</option>
                            <option value="Absent" ${r.status === 'Absent' ? 'selected' : ''}>✕ Absent</option>
                            <option value="Leave" ${r.status === 'Leave' ? 'selected' : ''}>🌴 Leave</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" class="att-notes-input" value="${r.notes || ''}" placeholder="Optional note...">
                    </td>
                </tr>
            `).join("");
        }

        async function saveAllAttendance() {
            const dateVal = document.getElementById("attDateSelect").value;
            const rows = document.querySelectorAll("#attendanceTableBody tr");
            const attendance = [];

            rows.forEach(tr => {
                const empId = tr.getAttribute("data-emp-id");
                const st = tr.querySelector(".att-status-select").value;
                const notes = tr.querySelector(".att-notes-input").value;
                if (empId) {
                    attendance.push({ employee_id: parseInt(empId), status: st, notes: notes });
                }
            });

            try {
                const res = await api.request("/api/attendance", {
                    method: "POST",
                    body: JSON.stringify({ date: dateVal, attendance: attendance })
                });
                showToast(res.message, "success", "Attendance Saved");
            } catch (e) {
                setStatus(e.message, "error");
            }
        }

        document.addEventListener("DOMContentLoaded", initAttendancePage);
    </script>
</body>
</html>
