<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MSME Digital ERP</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <!-- Live Business Canvas Background -->
    <canvas id="loginBgCanvas" class="login-bg-canvas"></canvas>

    <main class="auth-card" style="width: min(520px, 100%);">
        <div class="auth-logo">
            <div class="brand-icon">M</div>
            <span class="brand-text" style="font-size: 20px; font-weight: 800; color: var(--ink);">MSME <span style="color: var(--primary);">ERP</span></span>
        </div>
        <h2>Create Business Account</h2>
        <p class="muted">Initialize your company workspace and administrative profile.</p>

        <form id="registerForm" class="form-grid" style="gap: 14px;">
            <label>Business Name <span class="required-asterisk">*</span>
                <input name="business_name" required placeholder="e.g. Apex Industrial Solutions">
            </label>

            <label>Industry Category
                <input name="industry" placeholder="e.g. Manufacturing, Electronics">
            </label>

            <label>Your Full Name <span class="required-asterisk">*</span>
                <input name="name" required placeholder="e.g. Amit Sharma">
            </label>

            <label>Work Email <span class="required-asterisk">*</span>
                <input type="email" name="email" required placeholder="name@company.com" autocomplete="username">
            </label>

            <label class="full">Password (Min 6 chars) <span class="required-asterisk">*</span>
                <div class="password-wrapper">
                    <input type="password" name="password" id="regPassword" required minlength="6" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="toggle-password-btn" id="toggleRegPass" title="Show/Hide Password">👁</button>
                </div>
            </label>

            <div class="full" style="margin-top: 8px;">
                <button class="btn" type="submit" style="width: 100%;">Register Business Workspace</button>
            </div>
            <div data-status class="status full"></div>
        </form>

        <p class="auth-footer">Already registered? <a href="/">Sign in to your account</a></p>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/login-bg.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggleBtn = document.getElementById("toggleRegPass");
            const passInput = document.getElementById("regPassword");

            toggleBtn?.addEventListener("click", () => {
                const isPass = passInput.type === "password";
                passInput.type = isPass ? "text" : "password";
                toggleBtn.textContent = isPass ? "🙈" : "👁";
            });
        });
    </script>
</body>
</html>
